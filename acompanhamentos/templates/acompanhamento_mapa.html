<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mapa da Missão #{{ acompanhamento.id }}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { background: #1a1d21; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
        #map { height: 65vh; border-radius: 12px; border: 1px solid #2d3748; }

        /* ── Status Stepper ── */
        .stepper-container {
            background: #2d3748;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 16px;
            overflow-x: auto;
        }
        .stepper { display: flex; align-items: center; gap: 0; min-width: max-content; }
        .step { display: flex; flex-direction: column; align-items: center; position: relative; flex: 1; min-width: 80px; }
        .step-circle {
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700;
            border: 2px solid #4a5568;
            background: #1a1d21;
            color: #718096;
            z-index: 2;
            transition: all 0.4s ease;
        }
        .step-label {
            font-size: 0.62rem;
            text-align: center;
            margin-top: 6px;
            color: #718096;
            max-width: 75px;
            line-height: 1.2;
            transition: color 0.4s ease;
        }
        .step-connector {
            flex: 1;
            height: 3px;
            background: #4a5568;
            min-width: 14px;
            margin-top: -20px;
            transition: background 0.4s ease;
        }

        .step.completed .step-circle { background: #22c55e; border-color: #22c55e; color: white; }
        .step.completed .step-label  { color: #86efac; }
        .step-connector.completed    { background: #22c55e; }

        .step.active .step-circle {
            background: #3b82f6; border-color: #60a5fa; color: white;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
            animation: activePulse 2s infinite;
        }
        .step.active .step-label { color: #93c5fd; font-weight: 600; }

        .step.panic .step-circle {
            background: #ef4444; border-color: #ef4444; color: white;
            animation: panicPulseCircle 1s infinite;
        }
        .step.panic .step-label { color: #fca5a5; }

        @keyframes activePulse {
            0%, 100% { box-shadow: 0 0 8px rgba(59,130,246,.3); }
            50%      { box-shadow: 0 0 18px rgba(59,130,246,.7); }
        }
        @keyframes panicPulseCircle {
            0%, 100% { box-shadow: 0 0 8px rgba(239,68,68,.3); }
            50%      { box-shadow: 0 0 18px rgba(239,68,68,.8); }
        }

        /* ── Info bar ── */
        .info-bar {
            background: #2d3748;
            border-radius: 10px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .badge-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* ── Variante: Teste de Pânico ── */
        .panic-card.test {
            background: rgba(245, 158, 11, 0.15);
            border: 2px solid rgba(245, 158, 11, 0.95);
            box-shadow: 0 0 18px rgba(245, 158, 11, 0.35);
        }
        .panic-card.test .panic-title { color: #fde68a; }

        /* ── Panic Overlay ── */
        .panic-overlay { position: sticky; top: 12px; z-index: 2000; margin-bottom: 12px; }
        .panic-card {
            border-radius: 12px; padding: 14px;
            background: rgba(239, 68, 68, 0.15);
            border: 2px solid rgba(239, 68, 68, 0.9);
            box-shadow: 0 0 18px rgba(239, 68, 68, 0.35);
            animation: panicPulse 1s infinite;
            backdrop-filter: blur(6px);
        }
        @keyframes panicPulse {
            0%   { box-shadow: 0 0 12px rgba(239,68,68,.25); transform: scale(1); }
            50%  { box-shadow: 0 0 26px rgba(239,68,68,.65); transform: scale(1.01); }
            100% { box-shadow: 0 0 12px rgba(239,68,68,.25); transform: scale(1); }
        }
        .panic-header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
        .panic-title { font-weight:800; letter-spacing:.3px; font-size:1.05rem; display:flex; align-items:center; gap:10px; }
        .panic-blink-dot {
            width:10px; height:10px; border-radius:50%;
            background:#fff; display:inline-block; animation: blinkDot .6s infinite;
        }
        @keyframes blinkDot { 0%,100%{opacity:.2;} 50%{opacity:1;} }
        .panic-body { display:grid; gap:6px; font-size:.95rem; }
        .panic-actions { margin-top:12px; }

        /* ── Photos info ── */
        .photos-info {
            background: #2d3748;
            border-radius: 10px;
            padding: 10px 16px;
            margin-bottom: 12px;
            font-size: 0.85rem;
        }
        .photo-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border-radius: 16px;
            font-size: 0.78rem;
            font-weight: 500;
        }
        .photo-badge.valid   { background: rgba(34,197,94,.2);  color: #86efac; }
        .photo-badge.invalid { background: rgba(239,68,68,.2);  color: #fca5a5; }
        .photo-badge.pending { background: rgba(251,191,36,.2); color: #fde68a; }

        @keyframes currentPulse {
            0%   { transform: scale(1);   opacity: 0.55; }
            100% { transform: scale(2.4); opacity: 0; }
        }

        /* ── Route snapping indicator ── */
        .route-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(26, 29, 33, 0.85);
            backdrop-filter: blur(6px);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.75rem;
            color: #94a3b8;
            pointer-events: none;
        }
        .route-info .dot {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
        .route-info .dot.snapped { background: #22c55e; }
        .route-info .dot.raw     { background: #f59e0b; }
    </style>
</head>

<body>
<div class="container-fluid mt-3 mb-5">
    <div class="row">
        <div class="col-12 col-md-6">
            <a class="dropdown-item" href="{% url 'acompanhamentosPanicoList' %}">
                <i class="bi bi-arrow-left"></i> Voltar
            </a>
            <h4 class="mb-3">🗺️ Missão #{{ acompanhamento.id }}</h4>
        </div>
    </div>


    <!-- ══════ STATUS STEPPER ══════ -->
    <div class="stepper-container">
        <div class="stepper" id="stepper"></div>
    </div>

    <!-- ══════ INFO BAR ══════ -->
    <div class="info-bar">
        <div>
            <small class="text-secondary">Agente</small><br>
            <strong>{{ nome_agente }}</strong>
        </div>
        <div>
            <small class="text-secondary">Origem</small><br>
            <strong>{{ origem }}</strong>
        </div>
        <div>
            <small class="text-secondary">Status</small><br>
            <span class="badge-status" id="statusBadge" style="background:#3b82f6;color:white;">
                {{ status }}
            </span>
        </div>
        <div class="ms-auto text-end">
            <span id="dot" style="width:10px;height:10px;border-radius:50%;background:#f59e0b;display:inline-block;"></span>
            <span id="statusText" style="font-size:0.85rem;">Aguardando...</span><br>
            <small class="text-secondary">Última: <strong id="lastUpdate">-</strong></small>
        </div>
    </div>

    <!-- ══════ FOTOS INFO ══════ -->


    <!-- ══════ PANIC OVERLAY ══════ -->
    <div id="panicOverlay" class="panic-overlay d-none" role="alert" aria-live="assertive">
        <div class="panic-card">
            <div class="panic-header">
                <div class="panic-title" id="panicTitle">
                    🚨 PÂNICO ATIVO
                    <span class="panic-blink-dot"></span>
                </div>
            </div>
            <div class="panic-body">
                <div><strong>ID:</strong> <span id="panicId">-</span></div>
                <div><strong>Data:</strong> <span id="panicAt">-</span></div>
                <div><strong>Lat/Lng:</strong> <span id="panicLatLng">-</span></div>
            </div>
            <div class="panic-actions">
                <button type="button" class="btn btn-danger w-100" id="panicResolveBtn">
                    Resolver pânico
                </button>
            </div>
        </div>
    </div>

    <!-- ══════ MAPA ══════ -->
    <div id="map" class="mt-2" style="position: relative;">
        <div class="route-info" id="routeInfo" style="display:none;">
            <span class="dot snapped"></span> Rota nas ruas (OSRM)
        </div>
    </div>

    <div class="photos-info d-none mt-2" id="photosInfo">
        <strong>📷 Fotos:</strong>
        <span id="photosContent"></span>
    </div>
</div>

<script>
    // ═══════════════════════════════════════════════════
    // CONFIG
    // ═══════════════════════════════════════════════════
    const MISSION_ID = "{{ supabase_mission_id|escapejs }}";

    const REFRESH_MS     = 15000;
    const PANIC_POLL_MS  = 3000;
    const STATUS_POLL_MS = 5000;

    // APIs
    const TRACKING_URL = `/api/supabase/mission_tracking/?mission_id=${encodeURIComponent(MISSION_ID)}&limit=0&desc=false`;
    const PANIC_URL    = `/api/supabase/panic_alerts/?mission_id=${encodeURIComponent(MISSION_ID)}&limit=500`;
    const STATUS_URL   = `/api/supabase/mission/${encodeURIComponent(MISSION_ID)}/status/`;
    const ACK_PANIC    = (id) => `/api/supabase/panic_alerts/${encodeURIComponent(id)}/ack/`;
    const PANIC_RESOLVE_URL = `/api/supabase/mission/${encodeURIComponent(MISSION_ID)}/panic-resolve/`;

    // ✅ Fallback: processa fotos pendentes automaticamente (DEV/local + redundância)
    const PHOTOS_PROCESS_PENDING_URL =
    `/api/supabase/mission_photos/process-pending/?mission_id=${encodeURIComponent(MISSION_ID)}&limit=5`;

    const PHOTO_KICK_THROTTLE_MS = 8000;
    let __lastPhotoKickAt = 0;

    async function kickPhotoProcessingIfNeeded(photos) {
        const pending = (photos || []).filter(p => p && p.processed === false);
        if (!pending.length) return;

        const now = Date.now();
        if (now - __lastPhotoKickAt < PHOTO_KICK_THROTTLE_MS) return;
        __lastPhotoKickAt = now;

        try {
            await fetchJsonOrThrow(PHOTOS_PROCESS_PENDING_URL, {}, "process_pending_photos");
        } catch (e) {
            console.warn("process-pending falhou:", e?.message || e);
        }
    }


    // ⚠️ No seu urls.py enviado, essa rota não existe.
    // O código abaixo trata 404/500 sem quebrar o mapa.
    const GEOFENCE_CHECK_URL = `/api/supabase/mission/${encodeURIComponent(MISSION_ID)}/geofence-check/`;

    const GEOFENCE_CHECK_THROTTLE_MS = 30000;
    let __lastGeofenceCheckAt = 0;

    const pontosIniciais = JSON.parse('{{ localizacoes_json|escapejs }}') || [];

    // ═══════════════════════════════════════════════════
    // HELPERS
    // ═══════════════════════════════════════════════════
    function setStatus(ok, text) {
        document.getElementById("dot").style.background = ok ? "#22c55e" : "#ef4444";
        document.getElementById("statusText").textContent = text;
    }

    function formatDateSP(value) {
        if (!value) return "-";
        if (typeof value === "string" && /^\d{2}\/\d{2}\/\d{4}/.test(value.trim())) {
            return value;
        }

        let d = null;
        if (value instanceof Date) {
            d = value;
        } else if (typeof value === "number") {
            d = new Date(value);
        } else {
            let s = String(value).trim();
            if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}/.test(s) && !/Z|[+-]\d{2}:\d{2}$/.test(s)) {
                s = s.replace(" ", "T");
            }
            d = new Date(s);
        }

        if (!d || Number.isNaN(d.getTime())) return String(value);

        return d.toLocaleString("pt-BR", {
            timeZone: "America/Sao_Paulo",
            year: "numeric", month: "2-digit", day: "2-digit",
            hour: "2-digit", minute: "2-digit", second: "2-digit",
        });
    }

    function setLastUpdate() {
        document.getElementById("lastUpdate").textContent = new Date().toLocaleString("pt-BR", {
            timeZone: "America/Sao_Paulo",
            year: "numeric", month: "2-digit", day: "2-digit",
            hour: "2-digit", minute: "2-digit", second: "2-digit",
        });
    }

    function assertMissionId() {
        if (!MISSION_ID || String(MISSION_ID).trim().length < 6) {
            setStatus(false, "MISSÃO SEM ID DO SUPABASE");
            return false;
        }
        return true;
    }

    async function fetchJsonOrThrow(url, options = {}, label = "") {
        const resp = await fetch(url, { cache: "no-store", ...options });
        const raw = await resp.text();
        let data = null;
        try { data = raw ? JSON.parse(raw) : null; } catch (e) { }

        if (!resp.ok) {
            console.error(`[${label}] HTTP ${resp.status} em ${url}`, { raw, data });
            const msg = (data && (data.error || data.message)) ? (data.error || data.message) : `HTTP ${resp.status}`;
            const err = new Error(msg);
            err.httpStatus = resp.status;
            err.raw = raw;
            err.data = data;
            throw err;
        }

        if (!data) {
            console.error(`[${label}] Resposta não-JSON em ${url}`, { raw });
            throw new Error("Resposta inválida (não é JSON). Veja console.");
        }

        return data;
    }

    // ═══════════════════════════════════════════════════
    // STATUS STEPPER
    // ═══════════════════════════════════════════════════
    const STEPS = [
        { key: "pendente",                     label: "Pendente",        icon: "⏳" },
        { key: "missao_aceita",                label: "Aceita",          icon: "✅" },
        { key: "no_local",                     label: "No Local",        icon: "📍" },
        { key: "placa_inicio_verificada",      label: "Placa Início",    icon: "🔍" },
        { key: "odometro_inicio_verificado",   label: "KM Início",       icon: "📷" },
        { key: "teste_panico",                 label: "Teste Pânico",    icon: "🚨" },
        { key: "teste_panico_verificado",      label: "Pânico OK",       icon: "✔️" },
        { key: "em_andamento",                 label: "Em Andamento",    icon: "🚗" },
        { key: "odometro_final_verificado",    label: "KM Final",        icon: "📷" },
        { key: "placa_final_verificada",       label: "Placa Final",     icon: "🔍" },
        { key: "concluido",                    label: "Concluído",       icon: "🏁" },
    ];

    const STATUS_COLORS = {
        pendente:                     { bg: "#6b7280", text: "white" },
        missao_aceita:                { bg: "#3b82f6", text: "white" },
        no_local:                     { bg: "#10b981", text: "white" },
        placa_inicio_verificada:      { bg: "#a855f7", text: "white" },
        odometro_inicio_verificado:   { bg: "#8b5cf6", text: "white" },
        teste_panico:                 { bg: "#ef4444", text: "white" },
        teste_panico_verificado:      { bg: "#f59e0b", text: "black" },
        em_andamento:                 { bg: "#06b6d4", text: "white" },
        odometro_final_verificado:    { bg: "#8b5cf6", text: "white" },
        placa_final_verificada:       { bg: "#a855f7", text: "white" },
        concluido:                    { bg: "#22c55e", text: "white" },
    };

    function renderStepper(currentStatus) {
        const container = document.getElementById("stepper");
        container.innerHTML = "";

        const currentIdx = STEPS.findIndex(s => s.key === currentStatus);

        STEPS.forEach((step, i) => {
            const stepDiv = document.createElement("div");
            stepDiv.className = "step";
            if (i < currentIdx) stepDiv.classList.add("completed");
            else if (i === currentIdx) stepDiv.classList.add("active");
            if (i === currentIdx && currentStatus === "teste_panico") stepDiv.classList.add("panic");

            const circle = document.createElement("div");
            circle.className = "step-circle";
            circle.textContent = (i < currentIdx) ? "✓" : step.icon;

            const label = document.createElement("div");
            label.className = "step-label";
            label.textContent = step.label;

            stepDiv.appendChild(circle);
            stepDiv.appendChild(label);
            container.appendChild(stepDiv);

            if (i < STEPS.length - 1) {
                const conn = document.createElement("div");
                conn.className = "step-connector";
                if (i < currentIdx) conn.classList.add("completed");
                container.appendChild(conn);
            }
        });

        const badge = document.getElementById("statusBadge");
        const colors = STATUS_COLORS[currentStatus] || { bg: "#6b7280", text: "white" };
        badge.style.background = colors.bg;
        badge.style.color = colors.text;
        badge.textContent = STEPS.find(s => s.key === currentStatus)?.label || currentStatus;
    }

    // ═══════════════════════════════════════════════════
    // FOTOS INFO
    // ═══════════════════════════════════════════════════
    function renderPhotosInfo(photos) {
        const el = document.getElementById("photosInfo");
        const content = document.getElementById("photosContent");
        if (!photos || photos.length === 0) { el.classList.add("d-none"); return; }

        el.classList.remove("d-none");

        const TYPE_LABELS = {
            "placa_inicio":     "Início Placa",
            "odometro_inicio":  "Início KM",
            "odometro_final":   "Final KM",
            "placa_final":      "Final Placa",
        };

        let html = "";
        photos.forEach(p => {
            const photoType = p.type || "";
            const label = TYPE_LABELS[photoType] || photoType;
            const vr = p.validation_result || {};
            const isPlaca = photoType.startsWith("placa_");
            const isOdometro = photoType.startsWith("odometro_");

            if (!p.processed) {
                html += ` <span class="photo-badge pending">⏳ ${label}: Aguardando</span>`;
            } else if (isPlaca) {
                if (vr.valid) {
                    const plateNum = vr.plate_number || "?";
                    html += ` <span class="photo-badge valid">✅ ${label}: ${plateNum}</span>`;
                } else {
                    html += ` <span class="photo-badge invalid">❌ ${label}: Rejeitada</span>`;
                }
            } else if (isOdometro) {
                if (vr.valid) {
                    const odo = vr.odometer_value || vr.odometer_raw || "?";
                    html += ` <span class="photo-badge valid">✅ ${label}: ${odo}</span>`;
                } else {
                    html += ` <span class="photo-badge invalid">❌ ${label}: Rejeitada</span>`;
                }
            } else {
                html += ` <span class="photo-badge invalid">❌ ${label}: Rejeitada</span>`;
            }
        });
        content.innerHTML = html;
    }

    // ═══════════════════════════════════════════════════
    // OSRM ROUTE SNAPPING (CORE DA MELHORIA)
    // ═══════════════════════════════════════════════════

    /**
     * Usa a OSRM Match API para "encaixar" pontos GPS nas ruas reais.
     * Fallback: se OSRM falhar, usa OSRM Route API.
     * Fallback 2: se tudo falhar, retorna polyline reta (comportamento antigo).
     *
     * A API do OSRM aceita no máximo ~100 coordenadas por request,
     * então fazemos chunking para missões longas.
     */
    const OSRM_BASE = "https://router.project-osrm.org";
    const OSRM_MAX_COORDS = 100;    // limite seguro por request
    const OSRM_CACHE = new Map();    // cache simples: hash dos pontos → geometria

    function hashPoints(points) {
        // Hash rápido baseado em quantidade + primeiro + último ponto
        if (!points.length) return "empty";
        const f = points[0], l = points[points.length - 1];
        return `${points.length}_${f[0].toFixed(5)}_${f[1].toFixed(5)}_${l[0].toFixed(5)}_${l[1].toFixed(5)}`;
    }

    /**
     * Divide array de coordenadas em chunks com overlap de 1 ponto
     * para garantir continuidade entre segmentos.
     */
    function chunkCoords(coords, maxSize) {
        if (coords.length <= maxSize) return [coords];
        const chunks = [];
        for (let i = 0; i < coords.length; i += maxSize - 1) {
            chunks.push(coords.slice(i, i + maxSize));
        }
        return chunks;
    }

    /**
     * OSRM Match API — map matching (ideal para GPS tracking)
     * Encaixa pontos GPS nas ruas mais prováveis.
     */
    async function osrmMatch(lngLatPairs) {
        const coordStr = lngLatPairs.map(c => `${c[0]},${c[1]}`).join(";");
        // radiuses: tolerância em metros para cada ponto (GPS tem ~10-20m de erro)
        const radiuses = lngLatPairs.map(() => "25").join(";");

        const url = `${OSRM_BASE}/match/v1/driving/${coordStr}?overview=full&geometries=geojson&radiuses=${radiuses}`;

        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`OSRM Match HTTP ${resp.status}`);

        const data = await resp.json();
        if (data.code !== "Ok" || !data.matchings || data.matchings.length === 0) {
            throw new Error(`OSRM Match failed: ${data.code}`);
        }

        // Combinar todas as matchings em uma única lista de coordenadas
        let allCoords = [];
        for (const matching of data.matchings) {
            const coords = matching.geometry.coordinates; // [lng, lat]
            // Evitar duplicação no ponto de junção
            if (allCoords.length > 0) {
                const last = allCoords[allCoords.length - 1];
                const first = coords[0];
                if (last[0] === first[0] && last[1] === first[1]) {
                    allCoords = allCoords.concat(coords.slice(1));
                } else {
                    allCoords = allCoords.concat(coords);
                }
            } else {
                allCoords = coords;
            }
        }

        // Converter [lng, lat] → [lat, lng] para Leaflet
        return allCoords.map(c => [c[1], c[0]]);
    }

    /**
     * OSRM Route API — fallback se Match falhar
     * Calcula rota entre waypoints.
     */
    async function osrmRoute(lngLatPairs) {
        const coordStr = lngLatPairs.map(c => `${c[0]},${c[1]}`).join(";");
        const url = `${OSRM_BASE}/route/v1/driving/${coordStr}?overview=full&geometries=geojson`;

        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`OSRM Route HTTP ${resp.status}`);

        const data = await resp.json();
        if (data.code !== "Ok" || !data.routes || data.routes.length === 0) {
            throw new Error(`OSRM Route failed: ${data.code}`);
        }

        const coords = data.routes[0].geometry.coordinates;
        return coords.map(c => [c[1], c[0]]);
    }

    /**
     * Função principal: tenta Match, fallback para Route, fallback para linha reta.
     * Retorna { latlngs: [[lat,lng],...], snapped: boolean }
     */
    async function getSnappedRoute(trackingPoints) {
        if (trackingPoints.length < 2) {
            return { latlngs: trackingPoints.map(p => [p[0], p[1]]), snapped: false };
        }

        // Converter [lat, lng] → [lng, lat] para OSRM
        const lngLat = trackingPoints.map(p => [p[1], p[0]]);

        const cacheKey = hashPoints(lngLat);
        if (OSRM_CACHE.has(cacheKey)) {
            return OSRM_CACHE.get(cacheKey);
        }

        // Dividir em chunks se necessário
        const chunks = chunkCoords(lngLat, OSRM_MAX_COORDS);

        try {
            // Tentar Match API (melhor para GPS tracking)
            let allLatLngs = [];
            for (const chunk of chunks) {
                if (chunk.length < 2) continue;
                const chunkResult = await osrmMatch(chunk);
                // Merge sem duplicar ponto de junção
                if (allLatLngs.length > 0 && chunkResult.length > 0) {
                    const last = allLatLngs[allLatLngs.length - 1];
                    const first = chunkResult[0];
                    const dist = Math.abs(last[0] - first[0]) + Math.abs(last[1] - first[1]);
                    if (dist < 0.0001) {
                        allLatLngs = allLatLngs.concat(chunkResult.slice(1));
                    } else {
                        allLatLngs = allLatLngs.concat(chunkResult);
                    }
                } else {
                    allLatLngs = allLatLngs.concat(chunkResult);
                }
            }

            if (allLatLngs.length >= 2) {
                const result = { latlngs: allLatLngs, snapped: true, method: "match" };
                OSRM_CACHE.set(cacheKey, result);
                return result;
            }
            throw new Error("Match retornou poucos pontos");
        } catch (matchErr) {
            console.warn("[OSRM Match] falhou, tentando Route API...", matchErr.message);

            try {
                // Fallback: Route API (precisa de menos pontos, ~100 waypoints)
                // Para Route, usamos um subconjunto de pontos (a cada N pontos)
                const maxWaypoints = 50;
                let waypointLngLat;
                if (lngLat.length > maxWaypoints) {
                    const step = Math.ceil(lngLat.length / maxWaypoints);
                    waypointLngLat = lngLat.filter((_, i) => i === 0 || i === lngLat.length - 1 || i % step === 0);
                } else {
                    waypointLngLat = lngLat;
                }

                // Route também precisa de chunking
                const routeChunks = chunkCoords(waypointLngLat, OSRM_MAX_COORDS);
                let allLatLngs = [];

                for (const chunk of routeChunks) {
                    if (chunk.length < 2) continue;
                    const chunkResult = await osrmRoute(chunk);
                    if (allLatLngs.length > 0 && chunkResult.length > 0) {
                        const last = allLatLngs[allLatLngs.length - 1];
                        const first = chunkResult[0];
                        const dist = Math.abs(last[0] - first[0]) + Math.abs(last[1] - first[1]);
                        if (dist < 0.0001) {
                            allLatLngs = allLatLngs.concat(chunkResult.slice(1));
                        } else {
                            allLatLngs = allLatLngs.concat(chunkResult);
                        }
                    } else {
                        allLatLngs = allLatLngs.concat(chunkResult);
                    }
                }

                if (allLatLngs.length >= 2) {
                    const result = { latlngs: allLatLngs, snapped: true, method: "route" };
                    OSRM_CACHE.set(cacheKey, result);
                    return result;
                }
                throw new Error("Route retornou poucos pontos");
            } catch (routeErr) {
                console.warn("[OSRM Route] também falhou, usando linha reta.", routeErr.message);
                const result = {
                    latlngs: trackingPoints.map(p => [p[0], p[1]]),
                    snapped: false,
                    method: "raw"
                };
                OSRM_CACHE.set(cacheKey, result);
                return result;
            }
        }
    }

    // ═══════════════════════════════════════════════════
    // MAPA
    // ═══════════════════════════════════════════════════
    const map = L.map("map", { preferCanvas: true });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);

    let rotaSnapped = null;       // polyline da rota encaixada nas ruas
    let rotaRawGhost = null;      // polyline fantasma (pontos GPS reais, para debug)
    let markerInicio = null;
    let markerUltimo = null;
    let lastCount = 0;
    let didFitBounds = false;
    let geofenceCircle = null;
    let __snapInFlight = false;   // evitar requests concorrentes ao OSRM
    const panicLayer = L.layerGroup().addTo(map);

    const panicIcon = L.divIcon({
        className: "",
        html: `<div style="
            width:14px;height:14px;border-radius:50%;
            background:#ef4444;border:2px solid #fff;
            box-shadow:0 0 8px rgba(239,68,68,.8);
        "></div>`,
        iconSize: [14, 14], iconAnchor: [7, 7]
    });

    // Ícone customizado para última posição (pulso animado)
    const currentPosIcon = L.divIcon({
        className: "",
        html: `<div style="position:relative;width:20px;height:20px;">
            <div style="
                position:absolute;top:0;left:0;
                width:20px;height:20px;border-radius:50%;
                background:#3b82f6;border:3px solid #fff;
                box-shadow:0 0 10px rgba(59,130,246,.6);
                z-index:2;
            "></div>
            <div style="
                position:absolute;top:0;left:0;
                width:20px;height:20px;border-radius:50%;
                background:#3b82f6;
                animation: currentPulse 1.5s infinite;
                z-index:1;
            "></div>
        </div>`,
        iconSize: [20, 20], iconAnchor: [10, 10]
    });

    function normalizeTrackingPoints(pontos) {
        return (pontos || [])
            .map(p => ({
                id: p.id,
                latitude: Number(p.latitude),
                longitude: Number(p.longitude),
                criado_em: p.criado_em || null,
            }))
            .filter(p => Number.isFinite(p.latitude) && Number.isFinite(p.longitude));
    }

    function showRouteInfo(snapped, method) {
        const el = document.getElementById("routeInfo");
        if (snapped) {
            const dotEl = el.querySelector(".dot");
            dotEl.className = "dot snapped";
            el.innerHTML = `<span class="dot snapped"></span> Rota nas ruas (OSRM ${method || "match"})`;
        } else {
            el.innerHTML = `<span class="dot raw"></span> Rota aproximada (GPS direto)`;
        }
        el.style.display = "block";
    }

    async function renderOrUpdateMap(pontos) {
        const clean = normalizeTrackingPoints(pontos);
        if (clean.length === 0) { map.setView([-15, -55], 4); return; }

        const rawLatLngs = clean.map(p => [p.latitude, p.longitude]);

        // Se não mudou a quantidade de pontos, não refaz o snap
        if (rawLatLngs.length === lastCount && rotaSnapped) return;

        // Evitar requests concorrentes
        if (__snapInFlight) return;
        __snapInFlight = true;

        try {
            // Obter rota encaixada nas ruas
            const result = await getSnappedRoute(rawLatLngs);
            const snappedLatLngs = result.latlngs;

            // Rota principal (encaixada nas ruas)
            if (!rotaSnapped) {
                rotaSnapped = L.polyline(snappedLatLngs, {
                    color: "#3b82f6",
                    weight: 5,
                    opacity: 0.85,
                    smoothFactor: 1,
                    lineCap: "round",
                    lineJoin: "round",
                }).addTo(map);

                // Linha fantasma (pontos GPS reais) — sutil para debug visual
                rotaRawGhost = L.polyline(rawLatLngs, {
                    color: "#94a3b8",
                    weight: 1.5,
                    opacity: 0.25,
                    dashArray: "4 6",
                }).addTo(map);

                if (!didFitBounds) {
                    map.fitBounds(rotaSnapped.getBounds(), { padding: [30, 30] });
                    didFitBounds = true;
                }

                markerInicio = L.marker(rawLatLngs[0]).addTo(map)
                    .bindPopup("📍 Início");

                markerUltimo = L.marker(rawLatLngs[rawLatLngs.length - 1], {
                    icon: currentPosIcon,
                    zIndexOffset: 1000,
                }).addTo(map).bindPopup("🚗 Última posição");
            } else {
                rotaSnapped.setLatLngs(snappedLatLngs);
                rotaRawGhost.setLatLngs(rawLatLngs);
                markerUltimo.setLatLng(rawLatLngs[rawLatLngs.length - 1]);
            }

            lastCount = rawLatLngs.length;
            showRouteInfo(result.snapped, result.method);

        } catch (err) {
            console.error("[renderOrUpdateMap] erro no snap:", err);
            // Fallback total: linha reta como antes
            const rawLatLngs2 = clean.map(p => [p.latitude, p.longitude]);
            if (!rotaSnapped) {
                rotaSnapped = L.polyline(rawLatLngs2, {
                    color: "#3b82f6", weight: 4, opacity: 0.8,
                }).addTo(map);
                if (!didFitBounds) {
                    map.fitBounds(rotaSnapped.getBounds(), { padding: [30, 30] });
                    didFitBounds = true;
                }
                markerInicio = L.marker(rawLatLngs2[0]).addTo(map).bindPopup("📍 Início");
                markerUltimo = L.marker(rawLatLngs2[rawLatLngs2.length - 1]).addTo(map).bindPopup("🚗 Última posição");
            } else {
                rotaSnapped.setLatLngs(rawLatLngs2);
                markerUltimo.setLatLng(rawLatLngs2[rawLatLngs2.length - 1]);
            }
            lastCount = rawLatLngs2.length;
            showRouteInfo(false);
        } finally {
            __snapInFlight = false;
        }
    }

    // ═══════════════════════════════════════════════════
    // GEOFENCE CIRCLE
    // ═══════════════════════════════════════════════════
    function renderGeofence(geofence) {
        if (geofenceCircle) return;
        if (!geofence || !geofence.latitude || !geofence.longitude) return;

        geofenceCircle = L.circle(
            [geofence.latitude, geofence.longitude],
            {
                radius: geofence.raio || 60,
                color: "#f59e0b",
                fillColor: "#f59e0b",
                fillOpacity: 0.12,
                weight: 2,
                dashArray: "8 4",
            }
        ).addTo(map);

        geofenceCircle.bindPopup(
            `📍 <strong>Origem</strong><br>Raio: ${geofence.raio || 60}m`
        );

        L.marker([geofence.latitude, geofence.longitude], {
            icon: L.divIcon({
                className: "",
                html: `<div style="
                    width:16px;height:16px;border-radius:50%;
                    background:#f59e0b;border:3px solid #fff;
                    box-shadow:0 0 6px rgba(245,158,11,.6);
                "></div>`,
                iconSize: [16, 16], iconAnchor: [8, 8]
            })
        }).addTo(map).bindPopup("📍 Origem da Missão");

        if (!rotaSnapped && !didFitBounds) {
            map.setView([geofence.latitude, geofence.longitude], 15);
        }
    }

    // ═══════════════════════════════════════════════════
    // PÂNICO
    // ═══════════════════════════════════════════════════
    let currentPanicId = null;
    let currentMissionStatus = "{{ status|escapejs }}";

    function showPanicOverlay(panicData) {
        currentPanicId = panicData.id;

        const isTest = (panicData.test_mode === true);

        const card = document.querySelector("#panicOverlay .panic-card");
        const titleEl = document.getElementById("panicTitle");
        const btn = document.getElementById("panicResolveBtn");

        if (isTest) {
            card.classList.add("test");
            titleEl.innerHTML = `🧪 TESTE DE PÂNICO <span class="panic-blink-dot"></span>`;
            btn.textContent = "Confirmar teste de pânico";
            btn.classList.remove("btn-danger");
            btn.classList.add("btn-warning");
        } else {
            card.classList.remove("test");
            titleEl.innerHTML = `🚨 PÂNICO ATIVO <span class="panic-blink-dot"></span>`;
            btn.textContent = "Resolver pânico";
            btn.classList.remove("btn-warning");
            btn.classList.add("btn-danger");
        }

        document.getElementById("panicId").textContent = panicData.id ?? "-";
        const panicWhenRaw = panicData.timestamp ?? panicData.created_at ?? null;
        document.getElementById("panicAt").textContent = formatDateSP(panicWhenRaw);

        document.getElementById("panicLatLng").textContent =
            (panicData.lat != null && panicData.lng != null)
                ? `${Number(panicData.lat).toFixed(6)}, ${Number(panicData.lng).toFixed(6)}`
                : "-";

        document.getElementById("panicOverlay").dataset.testMode = isTest ? "1" : "0";
        document.getElementById("panicOverlay").classList.remove("d-none");
    }

    function hidePanicOverlay() {
        document.getElementById("panicOverlay").classList.add("d-none");
        currentPanicId = null;
    }

    function renderPanicMarkers(rows) {
        panicLayer.clearLayers();
        (rows || []).forEach(p => {
            const isTestMode = (p.test_mode === true);
            const lat = Number(p.lat);
            const lng = Number(p.lng);
            if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

            const isOpen = (p.acknowledged === false);

            const statusTxt = isTestMode
                ? (isOpen ? "🧪 TESTE DE PÂNICO" : "✅ TESTE CONFIRMADO")
                : (isOpen ? "🚨 PÂNICO ATIVO" : "✅ Resolvido");

            const color = isTestMode ? "#f59e0b" : (isOpen ? "#ef4444" : "#22c55e");
            const btnText = isTestMode ? "Confirmar teste" : "Resolver";
            const btnClass = isTestMode ? "btn-warning" : "btn-danger";

            const btnHtml = isOpen ? `
                <div class="mt-2">
                    <button type="button"
                        class="btn btn-sm ${btnClass} w-100 btn-ack-panico"
                        data-panico-id="${p.id}"
                        data-test-mode="${isTestMode ? "1" : "0"}">
                        ${btnText}
                    </button>
                </div>` : "";

            const when = formatDateSP(p.timestamp || p.created_at);

            const popup = `
                <div style="min-width:200px">
                    <div style="font-weight:700;color:${color};margin-bottom:4px">
                        ${statusTxt}
                    </div>
                    <div><strong>Data:</strong> ${when}</div>
                    <div><strong>Lat/Lng:</strong> ${lat.toFixed(6)}, ${lng.toFixed(6)}</div>
                    ${btnHtml}
                </div>`;

            L.marker([lat, lng], { icon: panicIcon }).bindPopup(popup).addTo(panicLayer);
        });
    }

    // ═══════════════════════════════════════════════════
    // FETCH
    // ═══════════════════════════════════════════════════
    async function fetchTracking() {
        const data = await fetchJsonOrThrow(TRACKING_URL, {}, "mission_tracking");
        return (data.rows || []).map(r => ({
            id: r.id,
            latitude: r.lat,
            longitude: r.lng,
            criado_em: r.timestamp || r.created_at,
        }));
    }

    async function fetchPanics() {
        return await fetchJsonOrThrow(PANIC_URL, {}, "panic_alerts");
    }

    async function fetchMissionStatus() {
        return await fetchJsonOrThrow(STATUS_URL, {}, "mission_status");
    }

    // ═══════════════════════════════════════════════════
    // GEOFENCE CHECK
    // ═══════════════════════════════════════════════════
    async function geofenceCheckIfNeeded(reason = "auto") {
        if (currentMissionStatus !== "missao_aceita") return;

        const now = Date.now();
        if (now - __lastGeofenceCheckAt < GEOFENCE_CHECK_THROTTLE_MS) return;
        __lastGeofenceCheckAt = now;

        try {
            const resp = await fetch(GEOFENCE_CHECK_URL, { cache: "no-store" });
            if (resp.status === 404) return;

            const raw = await resp.text();
            let data = null;
            try { data = raw ? JSON.parse(raw) : null; } catch(e) {}

            if (!resp.ok || !data || data.success !== true) {
                console.warn("[geofence-check] falhou", { status: resp.status, raw, data });
                return;
            }

            if (data.changed && data.new_status) {
                currentMissionStatus = data.new_status;
                renderStepper(currentMissionStatus);
            }
        } catch (e) {
            console.warn("[geofence-check] erro", e);
        }
    }

    // ═══════════════════════════════════════════════════
    // RESOLVE PANIC
    // ═══════════════════════════════════════════════════
    async function resolvePanic(panicId, isTestMode) {
        const ackData = await fetchJsonOrThrow(
            ACK_PANIC(panicId),
            { method: "POST", headers: { "Content-Type": "application/json" } },
            "panic_ack"
        );

        if (isTestMode) {
            try {
                const resolveData = await fetchJsonOrThrow(
                    PANIC_RESOLVE_URL,
                    { method: "POST", headers: { "Content-Type": "application/json" } },
                    "panic_resolve"
                );

                if (resolveData && resolveData.success && resolveData.new_status) {
                    currentMissionStatus = resolveData.new_status;
                    renderStepper(currentMissionStatus);
                }
            } catch (err) {
                if (err.httpStatus === 409) {
                    console.warn("panic-resolve 409:", err.data || err.raw);
                    return;
                }
                throw err;
            }
        }
    }

    // ═══════════════════════════════════════════════════
    // REFRESH ALL
    // ═══════════════════════════════════════════════════
    let __refreshInFlight = false;

    async function refreshAll(reason = "auto") {
        if (__refreshInFlight) return;
        __refreshInFlight = true;

        try {
            if (!assertMissionId()) return;
            setStatus(true, `Atualizando... (${reason})`);

            const results = await Promise.allSettled([
                fetchTracking(),
                fetchPanics(),
                fetchMissionStatus(),
            ]);

            const pontos      = results[0].status === "fulfilled" ? results[0].value : null;
            const panicData   = results[1].status === "fulfilled" ? results[1].value : null;
            const statusData  = results[2].status === "fulfilled" ? results[2].value : null;

            if (statusData) {
                if (statusData.status) {
                    currentMissionStatus = statusData.status;
                    renderStepper(currentMissionStatus);
                }
                renderPhotosInfo(statusData.photos || []);
                await kickPhotoProcessingIfNeeded(statusData.photos || []);
                renderGeofence(statusData.geofence);

                await geofenceCheckIfNeeded("refreshAll");
            }

            if (pontos) await renderOrUpdateMap(pontos);

            if (panicData) {
                renderPanicMarkers(panicData.rows || []);
                if (panicData.panic_active && panicData.open_panic) {
                    setStatus(false, "🚨 PÂNICO ATIVO");
                    showPanicOverlay(panicData.open_panic);
                } else {
                    hidePanicOverlay();
                    const count = pontos ? pontos.length : "?";
                    setStatus(true, `Monitorando... ${count} pontos`);
                }
            }

            setLastUpdate();
        } catch (err) {
            setStatus(false, `Falha: ${err?.message || err}`);
        } finally {
            __refreshInFlight = false;
        }
    }

    // ═══════════════════════════════════════════════════
    // STATUS POLLING
    // ═══════════════════════════════════════════════════
    let __statusPollInFlight = false;

    async function pollStatus() {
        if (__statusPollInFlight || __refreshInFlight || document.hidden) return;
        __statusPollInFlight = true;
        try {
            if (!assertMissionId()) return;
            const data = await fetchMissionStatus();

            if (data.status && data.status !== currentMissionStatus) {
                currentMissionStatus = data.status;
                renderStepper(currentMissionStatus);
                renderPhotosInfo(data.photos || []);
                await kickPhotoProcessingIfNeeded(data.photos || []);
            }

            renderGeofence(data.geofence);
            await geofenceCheckIfNeeded("pollStatus");
        } catch (e) { /* silencioso */ }
        finally { __statusPollInFlight = false; }
    }

    // ═══════════════════════════════════════════════════
    // PANIC POLLING
    // ═══════════════════════════════════════════════════
    let __panicPollInFlight = false;

    async function pollPanic() {
        if (__panicPollInFlight || __refreshInFlight || document.hidden) return;
        __panicPollInFlight = true;
        try {
            if (!assertMissionId()) return;
            const panicData = await fetchPanics();
            renderPanicMarkers(panicData.rows || []);
            if (panicData.panic_active && panicData.open_panic) {
                setStatus(false, "🚨 PÂNICO ATIVO");
                showPanicOverlay(panicData.open_panic);
            } else {
                hidePanicOverlay();
            }
        } catch (e) { /* silencioso */ }
        finally { __panicPollInFlight = false; }
    }

    // ═══════════════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════════════
    renderStepper(currentMissionStatus);
    renderOrUpdateMap(pontosIniciais);
    setStatus(true, "Mapa carregado.");
    setLastUpdate();

    refreshAll("start");
    setInterval(() => refreshAll("interval"), REFRESH_MS);
    setInterval(pollStatus, STATUS_POLL_MS);
    setInterval(pollPanic, PANIC_POLL_MS);

    // ═══════════════════════════════════════════════════
    // EVENT: Resolver pânico (popup)
    // ═══════════════════════════════════════════════════
    document.addEventListener("click", async (e) => {
        const btn = e.target.closest(".btn-ack-panico");
        if (!btn) return;

        e.preventDefault();
        const panicoId = btn.getAttribute("data-panico-id");
        const isTestMode = btn.getAttribute("data-test-mode") === "1";
        if (!panicoId) return;

        btn.disabled = true;
        const orig = btn.textContent;
        btn.textContent = "Resolvendo...";

        try {
            await resolvePanic(panicoId, isTestMode);
            await refreshAll("panic-ack");
        } catch (err) {
            alert(`Falha: ${err?.message || err}`);
        } finally {
            btn.disabled = false;
            btn.textContent = orig;
        }
    });

    // EVENT: Resolver pânico (overlay)
    document.getElementById("panicResolveBtn").addEventListener("click", async () => {
        if (!currentPanicId) return;

        const btn = document.getElementById("panicResolveBtn");
        const orig = btn.textContent;
        btn.disabled = true;
        btn.textContent = "Resolvendo...";

        const isTestMode = document.getElementById("panicOverlay").dataset.testMode === "1";

        try {
            await resolvePanic(currentPanicId, isTestMode);
            await refreshAll("panic-ack-overlay");
        } catch (err) {
            alert(`Falha: ${err?.message || err}`);
        } finally {
            btn.disabled = false;
            btn.textContent = orig;
        }
    });
</script>
