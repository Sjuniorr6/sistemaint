<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>{% block title %} | Listagem de Clientes Acompanhamento | {% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css"/>

        <!-- jQuery -->
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

        <!-- DataTables JS -->
        <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>

        <!-- DataTables PT-BR -->
        <script src="https://cdn.datatables.net/plug-ins/1.13.8/i18n/pt-BR.json"></script>
        
    {% load static %}
    {% load user_groups %}
</head>

<body>
    {% include 'components/_header.html' %}

    <style>
        body {
            max-width: 100%;
            overflow-x: hidden;
            background: #45494E;
        }

        .expedicao-title {
            /* font-size: 2.5rem; */
            font-weight: 700;
            color: white;
        }

        .expedicao-title i,
        .expedicao-sub-title {
            color: #bfa16c;
        }

        .content-main {
            background: #ffffff;
            border: 2px solid #bfa16c;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(191, 161, 108, 0.15);
            transition: all 0.3s ease;
        }

        /* Estilo Excel */
        .table-excel {
            overflow-x: auto;
            white-space: nowrap;
        }

        #tabela-cliente th,
        #tabela-cliente td {
            white-space: nowrap;
            vertical-align: middle;
        }

        #tabela-cliente th {
            background-color: #f8f9fa;
            font-weight: 600;
        }

        #tabela-cliente td {
            cursor: default;
        }

        @media screen and (max-width: 767px) {
            .header-tablee{
                flex-direction: column;
            }
        }
        
    </style>

    <div class="container mt-3 mb-5 text-center">
        <div class="row">
            <div class="col-12 mb-2">
                <div class="" style="display: flex; justify-content: center; align-items: center;">
                    <h1 class="expedicao-title">
                        Clientes Acompanhamento
                    </h1>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <div class="content-main">
                     <div class="table-responsive table-excel">
                        <table id="tabela-cliente" class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>Comercial</th>
                                    <th>Cliente</th>
                                    <th>CNPJ</th>
                                    <th>Email</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for item in clientes %}
                                <tr>
                                    <td>{{ item.comercial }}</td>
                                    <td>{{ item.nome }}</td>
                                    <td>{{ item.cnpj }}</td>
                                    <td>{{ item.email }}</td>
                                </tr> 
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            $('#tabela-cliente').DataTable({
                scrollX: true,
                scrollCollapse: true,
                autoWidth: false,

                language: {
                    url: "https://cdn.datatables.net/plug-ins/1.13.8/i18n/pt-BR.json"
                },

                pageLength: 10,
                lengthMenu: [10, 25, 50, 100],
                order: [[1, 'desc']]
            });
        });
    </script>

</body>

</html>
