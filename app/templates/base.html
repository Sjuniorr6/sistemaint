<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}| Grupo Golden Sat |{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <!-- Inclusão do cabeçalho -->
    {% include 'components/_header.html' %}
    
    {% if request.resolver_match.url_name == 'kanban_gestao' %}
        <!-- Layout full-width para o Kanban SEM container limitador -->
        <div style="width: 100%; padding: 0; margin: 0;">
            {% block content %}
            {% endblock %}
        </div>
    {% else %}
        <!-- Layout padrão com container -->
        <div class="container-fluid">
            <div class="row">
                <main class="col py-3">
                    <div class="container mt-4">
                        {% block content %}
                        {% endblock %}
                    </div>
                </main>
            </div>
        </div>
    {% endif %}

    <!-- Script para o Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
   
</body>
</html>
