{% comment %}
  Modal "Registrar envio" (Expedição → Financeiro): método, data e rastreio
  (opcional) do envio dos equipamentos ao cliente.
{% endcomment %}
<div class="modal fade" id="modalRegistrarEnvio" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form method="post" action="{% url 'chamados:acao' chamado.pk Acao.REGISTRAR_ENVIO %}">
      {% csrf_token %}
      <div class="modal-content border-0 shadow" style="border-radius: var(--ch-radius, .85rem);">
        <div class="modal-header bg-primary border-0">
          <h5 class="modal-title text-white"><i class="bi bi-truck me-2"></i>Registrar envio</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body p-4">
          <div class="row g-3">
            {% for campo in registrar_envio_form %}
              <div class="col-md-{% if forloop.last %}12{% else %}6{% endif %}">
                <label for="{{ campo.id_for_label }}" class="form-label fw-semibold">{{ campo.label }}</label>
                {{ campo }}
              </div>
            {% endfor %}
          </div>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary fw-semibold">Registrar envio</button>
        </div>
      </div>
    </form>
  </div>
</div>
