{% extends 'base.html' %}
{% block title %}Confirmar Exclusão{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>Confirmação de exclusão</h2>
    <p>Tem certeza que deseja apagar "{{ object }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sim, apagar</button>
        <a href="{{ request.META.HTTP_REFERER|default: '/' }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
