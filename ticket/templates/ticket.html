{% extends 'base.html' %}
{% block content %}

<style>
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
  }

  .modern-container {
    max-width: 720px;
    margin: 3rem auto;
    padding: 0 1rem;
  }

  .ticket-header {
    text-align: center;
    margin-bottom: 2.5rem;
    animation: fadeInDown 0.6s ease-out;
  }

  .ticket-header h1 {
    font-size: 2.5rem;
    font-weight: 700;
    color: white;
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
  }

  .ticket-header h1 i {
    color: #bfa16c;
  }

  .ticket-header p {
    /* color: #6b6b6b; */
    font-size: 1.1rem;
    font-weight: 500;
  }

  .modern-card {
    background: #ffffff;
    border-radius: 24px;
    padding: 3rem 2.5rem;
    box-shadow: 0 8px 32px rgba(191, 161, 108, 0.15);
    animation: fadeInUp 0.6s ease-out;
    border: 2px solid #bfa16c;
  }

  .form-group {
    margin-bottom: 1.75rem;
    animation: fadeIn 0.8s ease-out;
  }

  .form-group label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-weight: 600;
    color: #1e293b;
    margin-bottom: 0.75rem;
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .form-group label i {
    color: #bfa16c;
    font-size: 1.1rem;
  }

  .form-control,
  .form-select {
    width: 100%;
    padding: 0.9rem 1.2rem;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    font-size: 1rem;
    color: #1e293b;
    background: #f8fafc;
    transition: all 0.3s ease;
    font-family: "Inter", sans-serif;
  }

  .form-control:focus,
  .form-select:focus {
    outline: none;
    border-color: #bfa16c;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(191, 161, 108, 0.1);
    transform: translateY(-2px);
  }

  textarea.form-control {
    min-height: 140px;
    resize: vertical;
    font-family: "Inter", sans-serif;
  }

  .btn-submit {
    width: 100%;
    padding: 1.1rem 2rem;
    background: linear-gradient(90deg, #665b1d 0%, #bfa16c 100%);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 6px 20px rgba(102, 91, 29, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    margin-top: 2rem;
  }

  .btn-submit:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(191, 161, 108, 0.4);
    background: linear-gradient(90deg, #bfa16c 0%, #665b1d 100%);
  }

  .btn-submit:active {
    transform: translateY(-1px);
  }

  .helptext {
    display: block;
    margin-top: 0.5rem;
    font-size: 0.85rem;
    color: #64748b;
    font-style: italic;
  }

  @keyframes fadeInDown {
    from {
      opacity: 0;
      transform: translateY(-30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }

  /* Responsivo */
  @media (max-width: 768px) {
    .modern-container {
      margin: 1.5rem auto;
    }

    .ticket-header h1 {
      font-size: 2rem;
    }

    .modern-card {
      padding: 2rem 1.5rem;
      border-radius: 20px;
    }

    .form-control,
    .form-select {
      padding: 0.8rem 1rem;
    }
  }

  @media (max-width: 576px) {
    .modern-container {
      margin: 1rem auto;
    }

    .ticket-header h1 {
      font-size: 1.75rem;
    }

    .ticket-header p {
      font-size: 1rem;
    }

    .modern-card {
      padding: 1.5rem 1.25rem;
      border-radius: 16px;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .btn-submit {
      padding: 1rem 1.5rem;
      font-size: 1rem;
    }
  }
</style>

<div class="modern-container">
  <div class="ticket-header">
    <h1><i class="bi bi-ticket-perforated-fill"></i> Novo Ticket</h1>
    <p class="text-white">Registre seu chamado e acompanhe o status</p>
  </div>

  <div class="modern-card">
    <form method="post" id="ticketForm">
      {% csrf_token %} {% for field in form %}
      <div class="form-group">
        <label for="{{ field.id_for_label }}">
          {% if field.name == 'setor' %}
          <i class="bi bi-building"></i>
          {% elif field.name == 'erro' %}
          <i class="bi bi-exclamation-triangle"></i>
          {% elif field.name == 'correcao' %}
          <i class="bi bi-tools"></i>
          {% else %}
          <i class="bi bi-pencil-square"></i>
          {% endif %} {{ field.label }}
        </label>
        {{ field }} {% if field.help_text %}
        <span class="helptext">{{ field.help_text }}</span>
        {% endif %} {% if field.errors %}
        <div class="text-danger mt-2">{{ field.errors }}</div>
        {% endif %}
      </div>
      {% endfor %}

      <button type="submit" class="btn-submit">
        <i class="bi bi-check-circle"></i>
        <span>Criar Ticket</span>
      </button>
    </form>
  </div>
</div>

<script>
  // Animação suave no submit
  document
    .getElementById("ticketForm")
    .addEventListener("submit", function (e) {
      const btn = this.querySelector(".btn-submit");
      btn.innerHTML =
        '<i class="bi bi-hourglass-split"></i> <span>Criando...</span>';
      btn.style.opacity = "0.7";
    });
</script>

{% endblock %}
